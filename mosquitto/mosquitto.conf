# Mosquitto MQTT Broker configuration file
# Standalone Desktop Deployment Configuration

# ─── Listeners ─────────────────────────────────────────────
# Standard TCP MQTT listener on all interfaces
listener 1883 0.0.0.0

# MQTT over WebSockets listener on all interfaces
listener 9001 0.0.0.0
protocol websockets

# ─── Persistence ───────────────────────────────────────────
persistence true
persistence_location C:/ProgramData/PhantomationDeviceOps/data/
autosave_interval 60

# ─── Logging ───────────────────────────────────────────────
log_dest file C:/ProgramData/PhantomationDeviceOps/logs/mqtt.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ─── Security ──────────────────────────────────────────────
allow_anonymous true
