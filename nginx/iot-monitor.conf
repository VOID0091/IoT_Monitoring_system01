# NGINX configuration for Phantomation DeviceOps Platform
# Put this in /etc/nginx/sites-available/phantomation-deviceops.conf and symlink to sites-enabled

server {
    listen 80;
    server_name localhost;

    # ─── Frontend Static Files / Dev Proxy ──────────────────
    location / {
        # For production (serving build directory):
        # root /var/www/phantomation-deviceops/frontend/dist;
        # index index.html;
        # try_files $uri $uri/ /index.html;

        # For development (proxying Vite dev server):
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── FastAPI backend API ────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for streaming responses if any
        proxy_buffering off;
    }

    # ─── FastAPI backend WebSockets ─────────────────────────
    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings for WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
